<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AREA MAIBAB บัญชีหน้างาน</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AREA MAIBAB">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFC800">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEEE9; --surface:#F8F8F4; --ink:#1D262B; --muted:#5F6A73; --line:#D3D6CE;
  --amber:#F0A500; --amber-ink:#2B1E00; --in:#2A7147; --out:#AE3F27; --warn:#B26A00;
  --bar:#C9CCC3; --c1:#F0A500; --c2:#1D262B; --c3:#2F6FB3; --c4:#7A4FA0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --display:'Prompt','Sarabun',sans-serif; --body:'Sarabun','Noto Sans Thai',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151A1D; --surface:#1E2529; --ink:#E8ECE7; --muted:#97A1A8; --line:#2F393F;
    --amber:#F5B324; --amber-ink:#2B1E00; --in:#5DB57F; --out:#E67F66; --warn:#E9A23B; --bar:#333E44; --c1:#F5B324; --c2:#E8ECE7; --c3:#6FA3DD; --c4:#B08AD6;
  }
}
:root[data-theme="dark"]{
  --bg:#151A1D; --surface:#1E2529; --ink:#E8ECE7; --muted:#97A1A8; --line:#2F393F;
  --amber:#F5B324; --amber-ink:#2B1E00; --in:#5DB57F; --out:#E67F66; --warn:#E9A23B; --bar:#333E44; --c1:#F5B324; --c2:#E8ECE7; --c3:#6FA3DD; --c4:#B08AD6;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:96px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* header */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.hd-in{display:flex;align-items:center;gap:8px;padding:12px 16px 10px}
.hd h1{font-family:var(--display);font-size:1.25rem;font-weight:700;margin:0;flex:1}
.hd .ghost{background:none;border:0;padding:8px 10px;min-height:44px;color:var(--muted);font-weight:500;border-radius:8px}
.stripe{height:6px;background:repeating-linear-gradient(-45deg,var(--amber) 0 12px,var(--ink) 12px 24px)}

main{padding:8px 16px 0}
.sec{margin-top:26px}
.sec h2{font-family:var(--display);font-size:1rem;font-weight:600;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2 a,.link{background:none;border:0;color:var(--muted);font-size:.9rem;font-weight:500;padding:4px 0;text-decoration:underline;text-underline-offset:3px}

/* cash panel */
.cash{margin-top:8px;padding:20px 18px;background:var(--surface);border-left:8px solid var(--amber);border-radius:4px 14px 14px 4px}
.cash small{color:var(--muted)}
.cash .big{font-size:2.5rem;font-weight:700;line-height:1.15;margin:2px 0 10px}
.cash .mrow{display:flex;gap:20px;flex-wrap:wrap;font-size:.95rem}
.in{color:var(--in)} .out{color:var(--out)} .muted{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.two button{background:none;border:0;text-align:left;padding:14px 4px;min-height:72px}
.two button+button{border-left:1px solid var(--line);padding-left:16px}
.two b{display:block;font-family:var(--display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.two span{font-size:.88rem;color:var(--muted)}

/* rows */
.row{display:flex;width:100%;gap:12px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;min-height:64px}
.row .l{flex:1;min-width:0}
.row .l b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .l small{color:var(--muted);font-size:.85rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right}
.row .r .num{font-weight:600;font-size:1.05rem;display:block}
.tag{display:inline-block;font-size:.74rem;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-left:4px}
.tag.pend{border-color:var(--warn);color:var(--warn);font-weight:600}
.tag.late{background:var(--out);border-color:var(--out);color:#fff;font-weight:600}
.empty{padding:22px 4px;color:var(--muted)}

/* bars */
.bar{height:10px;background:var(--bar);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--in);border-radius:99px}
.bar.warn i{background:var(--warn)} .bar.over i{background:var(--out)}
.proj{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 2px}
.proj .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:8px}
.proj b{font-family:var(--display);font-weight:600}
.proj .meta{display:flex;justify-content:space-between;font-size:.86rem;color:var(--muted);margin-top:6px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-around;padding:6px 6px 8px}
.nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;min-height:52px;color:var(--muted);font-weight:500;border-radius:10px}
.nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--ink);font-weight:600}
.nav button.on svg{stroke-width:2.4}
.nav .add{flex:0 0 64px;height:64px;margin-top:-26px;border-radius:50%;background:var(--amber);color:var(--amber-ink);border:4px solid var(--bg);min-height:64px}
.nav .add svg{width:30px;height:30px;stroke-width:2.6}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.action-card{min-height:58px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;gap:9px;font-family:var(--display);font-weight:600}
.action-card svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.action-card.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
@media(min-width:480px){.action-grid{gap:12px}.action-card{min-height:62px}}

/* forms */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{background:none;border:0;padding:12px 8px;min-height:48px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg button.on.in-c{background:var(--in);color:#fff}
.seg button.on.out-c{background:var(--out);color:#fff}
.field{margin-top:18px}
.field>label,.lbl{display:block;font-weight:600;margin-bottom:6px;font-size:.95rem}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;min-height:48px;padding:10px 12px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;font-size:16px}
.amt{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--ink);border-radius:12px;padding:6px 14px}
.amt span{font-family:var(--display);font-size:1.8rem;color:var(--muted)}
.amt input{border:0;background:none;min-height:60px;padding:0;font-family:var(--display);font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums}
.amt input:focus-visible{outline:none}
.amt:focus-within{outline:3px solid var(--amber);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:99px;padding:8px 14px;min-height:44px;font-weight:500}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.tog{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px}
.tog .sw{flex:0 0 46px;height:26px;border-radius:99px;background:var(--bar);position:relative;transition:background .15s}
.tog .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.tog.on{border-color:var(--ink)}
.tog.on .sw{background:var(--in)} .tog.on .sw::after{transform:translateX(20px)}
.tog small{display:block;color:var(--muted);font-size:.82rem}
.prev{margin-top:14px;padding:12px 14px;border-left:4px solid var(--line);color:var(--muted);font-size:.92rem;min-height:24px}
.prev b{color:var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:12px;border:2px solid var(--ink);background:none;font-weight:600;font-size:1rem;padding:10px 16px;text-align:center}
.btn.pri{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-family:var(--display);font-size:1.1rem}
.btn.dng{border-color:var(--out);color:var(--out)}
.btn.dng.sure{background:var(--out);color:#fff}
.btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stack{display:grid;gap:10px;margin-top:20px}
.photo{margin-top:10px;position:relative}
.photo img{width:100%;max-height:260px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
input[type=file]{display:none}

.grp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gbtn{background:var(--surface);border:2px solid var(--line);border-radius:12px;min-height:58px;font-family:var(--display);font-weight:600;font-size:1rem;padding:8px}
.gbtn.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.subrow{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--muted);padding:3px 0 3px 12px}
@keyframes up{from{transform:translateY(28px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
main.enter{animation:fade .18s ease-out}
.sheet.up{animation:up .22s ease-out}
button,a,input,select,textarea,label{touch-action:manipulation}
button:active{transform:scale(.985)}
.row:active,.proj:active{background:var(--surface)}
#app.nonav{padding-bottom:0}
.savebar{position:sticky;bottom:0;z-index:15;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;margin:24px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.savebar .btn{min-height:56px}
.pv table th,.pv table td{font-size:.82rem}
@media print{
  :root:not([data-theme="light"]),:root[data-theme="dark"],:root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#444;--line:#bbb;--in:#1b5e37;--out:#8f2f1b;--bar:#ddd;--c1:#F0A500;--c2:#1D262B;--c3:#2F6FB3;--c4:#7A4FA0;padding:0}
  body{background:#fff}
  .hd,.nav,.toast,.noprint,.scrim,.savebar{display:none!important}
  #app{max-width:none;padding-bottom:0}
  main{padding:0}
  tr{page-break-inside:avoid}
}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{background:var(--amber);color:var(--amber-ink);font-family:var(--display);font-weight:700;padding:6px 10px;border-radius:8px;letter-spacing:.06em;font-size:1rem;flex:none}
.brand b{display:block;font-family:var(--display);line-height:1.15;font-size:1.1rem}
.brand small{color:var(--muted);font-size:.78rem}
.donut{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;padding:10px 0 4px}
.lgs{flex:1;min-width:150px}
.lg{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:.92rem}
.lg i{width:12px;height:12px;border-radius:3px;flex:none}
.lg span{flex:1}
/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,14,16,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-family:var(--display);margin:0 0 4px;font-size:1.25rem}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;font-weight:500}
textarea.csv{min-height:180px;font-size:.8rem;font-family:ui-monospace,monospace}

/* stats grid */
.grid4{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:16px}
.grid4>div{padding:12px 2px;border-bottom:1px solid var(--line)}
.grid4>div:nth-child(odd){padding-right:12px}
.grid4>div:nth-child(even){padding-left:14px;border-left:1px solid var(--line)}
.grid4 small{display:block;color:var(--muted);font-size:.84rem}
.grid4 b{font-family:var(--display);font-size:1.15rem;font-variant-numeric:tabular-nums}
.crow{padding:8px 0}
.crow .h{display:flex;justify-content:space-between;font-size:.93rem;margin-bottom:5px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.mnav button{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;min-width:48px;min-height:48px;font-size:1.2rem}
.mnav b{font-family:var(--display);font-size:1.1rem}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:.92rem;max-width:90vw}
.role{margin-top:6px;font-size:.85rem;color:var(--muted)}
.wrapx{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{color:var(--muted);font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* Work v1.3 live continuation */
.project-hero{width:100%;text-align:left;background:#20282d;color:#fff;border:0;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 10px 26px rgba(20,28,32,.12)}
.project-hero-kicker{display:flex;justify-content:space-between;align-items:center;color:#f0ad2d;font-size:.82rem;font-weight:800;margin-bottom:10px}
.project-hero>b{display:block;font-size:1.2rem;line-height:1.35;margin-bottom:6px}.project-hero small{display:block;color:#bfc6ca}.hero-link{display:block;margin-top:14px;color:#f4b333;font-weight:700;font-size:.86rem}
.status-pill{background:#e7f5ea;color:#26733f;border-radius:999px;padding:5px 9px;font-size:.72rem}
.cash-modern{border-radius:18px!important;box-shadow:0 8px 24px rgba(20,28,32,.06)}
.kpi4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 18px}.kpi4 button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;min-height:96px}.kpi4 small,.kpi4 span{display:block;color:var(--muted);font-size:.78rem}.kpi4 b{display:block;font-size:1.12rem;margin:6px 0}
@media(min-width:700px){.kpi4{grid-template-columns:repeat(4,1fr)}}
 .mini-status{display:inline-block;background:#eef1f2;border-radius:999px;padding:3px 7px;font-size:.72rem;color:var(--ink);white-space:nowrap}
/* business documents */
.doc-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:14px 0 16px}.doc-head b{display:block;font-size:1.15rem}.doc-head small{color:var(--muted)}.doc-new{width:auto!important;padding:10px 14px!important}.doc-row{margin-bottom:8px}
.quote-paper{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:12px 0 30px}.quote-top{display:flex;justify-content:space-between;gap:18px;border-bottom:3px solid #efaa2c;padding-bottom:16px}.quote-brand{display:flex;gap:12px;align-items:center;min-width:0}.quote-brand img{width:64px;height:64px;object-fit:cover;border-radius:12px}.quote-brand b,.quote-brand small{display:block}.quote-brand small{color:var(--muted);font-size:.76rem;line-height:1.45}.quote-title{text-align:right}.quote-title b{display:block;font-size:1.55rem}.quote-title span{color:var(--muted);letter-spacing:.08em}.quote-meta{display:grid;grid-template-columns:1fr auto;gap:20px;padding:18px 0}.quote-meta b,.quote-meta span,.quote-meta small{display:block}.quote-meta small{color:var(--muted)}.quote-table{width:100%;border-collapse:collapse}.quote-table th{background:#20282d;color:#fff}.quote-table th,.quote-table td{padding:10px 8px;border:1px solid #dfe2e3;text-align:left;font-size:.86rem}.quote-total{margin:18px 0 0 auto;max-width:330px}.quote-total>div{display:flex;justify-content:space-between;padding:7px 0}.quote-total .grand{border-top:2px solid #20282d;font-size:1.15rem}.quote-total>small{display:block;text-align:right;color:var(--muted);padding:7px 0}.quote-note{border-top:1px solid var(--line);padding-top:14px;margin-top:18px}.quote-note p{white-space:pre-wrap;color:var(--muted)}.quote-sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;text-align:center;margin-top:46px;line-height:1.8}.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.quote-paper{padding:14px}.quote-top{display:block}.quote-title{text-align:left;margin-top:14px}.quote-meta{grid-template-columns:1fr}.quote-table{min-width:620px}.quote-paper{overflow-x:auto}.quick-actions{grid-template-columns:1fr}}
@media print{body{background:#fff}.header,.nav,.no-print{display:none!important}.quote-paper{border:0;box-shadow:none;margin:0;padding:0}.quote-table{min-width:0}main{padding:0!important;max-width:none!important}}
 .doc-create{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:10px 0 18px}.empty.compact{padding:16px}.sec h2 .muted{font-size:.78rem;font-weight:400}
@media(max-width:560px){.doc-create{grid-template-columns:1fr}.doc-create .btn{margin:0}}
 .doc-item{display:grid;grid-template-columns:2fr .7fr .8fr 1fr;gap:7px;margin:8px 0}.doc-item input{min-width:0}
@media(max-width:560px){.doc-item{grid-template-columns:1fr 1fr}.doc-item input:first-child{grid-column:1/-1}}
/* AREA Ledger preview theme */

    return true;
  }
  var ch=false;
  if(t.date!==p.retPaidDate){t.date=p.retPaidDate;ch=true;}
  if(+t.amount!==+p.retAmt){t.amount=+p.retAmt;ch=true;}
  if(t.cat!=='ค่าประกัน/ค่างาน'){t.cat='ค่าประกัน/ค่างาน';ch=true;}
  if((t.sub||'').trim()!=='ประกันสัญญา'){t.sub='ประกันสัญญา';ch=true;}
  if(t.type!=='out'){t.type='out';ch=true;}
  if(!t.paid){t.paid=true;t.due='';ch=true;}
  if(!t.pay){t.pay='transfer';ch=true;}
  return ch;
}

/* ---------- คำนวณ ---------- */
function base(t){return t.vat?t.amount/1.07:t.amount;}
function vatOf(t){return t.vat?t.amount-base(t):0;}
function whtOf(t){return t.wht?base(t)*0.03:0;}
function net(t){return t.amount-whtOf(t);}
function cashSplit(){
  var b=+S.opening||0,c=+S.openCash||0;
  S.tx.forEach(function(t){if(!t.paid)return;var v=(t.type==='in'?1:-1)*net(t);if(t.pay==='cash')c+=v;else b+=v;});
  return {bank:b,cash:c};
}
function cashBalance(){var x=cashSplit();return x.bank+x.cash;}
function pending(type){return S.tx.filter(function(t){return !t.paid&&t.type===type;});}
function sumNet(list){return list.reduce(function(a,t){return a+net(t);},0);}
function stats(pid){
  var s={inB:0,outB:0,recd:0,recPend:0,payPend:0,paidOut:0,byCat:{},bySub:{}};
  S.tx.forEach(function(t){
    if(t.pid!==pid)return;
    if(t.type==='in'){s.inB+=base(t);if(t.paid)s.recd+=net(t);else s.recPend+=net(t);}
    else{s.outB+=base(t);s.byCat[t.cat]=(s.byCat[t.cat]||0)+base(t);var sk=t.sub||'ไม่ระบุรายละเอียด';var bs=s.bySub[t.cat]||(s.bySub[t.cat]={});bs[sk]=(bs[sk]||0)+base(t);if(t.paid)s.paidOut+=net(t);else s.payPend+=net(t);}
  });
  return s;
}

function donut(byCat,total,label){
  var ks=Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a];});
  if(!total||!ks.length)return '<div class="empty">ยังไม่มีรายจ่ายให้แสดงสัดส่วน</div>';
  var off=25,seg='',lg='';
  ks.forEach(function(k){
    var pc=byCat[k]/total*100,col=GCOL[k]||'var(--muted)';
    seg+='<circle cx="21" cy="21" r="15.9155" fill="none" stroke="'+col+'" stroke-width="6" stroke-dasharray="'+pc.toFixed(3)+' '+(100-pc).toFixed(3)+'" stroke-dashoffset="'+off.toFixed(3)+'"/>';
    off-=pc;
    lg+='<div class="lg"><i style="background:'+col+'"></i><span>'+esc(k)+'</span><b class="num">'+Math.round(pc)+'%</b></div>';
  });
  var tt=total>=1000000?'฿'+(total/1000000).toFixed(2)+' ล้าน':fmt(total);
  return '<div class="donut"><svg viewBox="0 0 42 42" role="img" aria-label="สัดส่วนค่าใช้จ่ายตามหมวด" style="width:150px;height:150px;flex:none"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--bar)" stroke-width="6"/>'+seg+
    '<text x="21" y="20" text-anchor="middle" font-size="2.8" fill="var(--muted)" font-family="Sarabun,sans-serif">'+esc(label||'รายจ่ายรวม')+'</text><text x="21" y="24.6" text-anchor="middle" font-size="3.3" font-weight="700" fill="var(--ink)" font-family="Prompt,sans-serif">'+tt+'</text></svg><div class="lgs">'+lg+'</div></div>';
}

function doCopy(id,ok){
  var box=document.getElementById(id);if(!box)return;box.focus();box.select();
  try{box.setSelectionRange(0,box.value.length);}catch(x){}
  var done=false;try{done=document.execCommand('copy');}catch(x){}
  if(done){ok();return;}
  if(navigator.clipboard){navigator.clipboard.writeText(box.value).then(ok,function(){toast('แตะค้างที่ข้อความแล้วเลือกคัดลอก');});}
  else toast('แตะค้างที่ข้อความแล้วเลือกคัดลอก');
}
function storageOK(){try{localStorage.setItem('__t','1');var v=localStorage.getItem('__t');localStorage.removeItem('__t');return v==='1';}catch(e){return false;}}
function isStandalone(){return !!(window.navigator.standalone||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches));}
function toast(msg){

  var d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=msg;document.body.appendChild(d);
  setTimeout(function(){d.remove();},2200);
}

function prevText(d){

    c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nm.length,true);c.setUint16(30,0,true);c.setUint16(32,0,true);c.setUint16(34,0,true);c.setUint16(36,0,true);c.setUint32(38,0,true);c.setUint32(42,off,true);

function csvText(){
  var rows=[['วันที่','ประเภท','หมวด','รายละเอียด','โครงการ','คู่ค้า','จำนวนเงิน','ก่อน VAT','VAT','หัก ณ ที่จ่าย','สุทธิ','สถานะ','ช่องทางชำระ','ครบกำหนด','หมายเหตุ']];
  S.tx.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(t){
    rows.push([t.date,t.type==='in'?'รายรับ':'รายจ่าย',t.cat,t.sub||'',pname(t.pid),t.partner,t.amount,base(t).toFixed(2),vatOf(t).toFixed(2),whtOf(t).toFixed(2),net(t).toFixed(2),t.paid?'ชำระแล้ว':'ค้าง',t.paid?(t.pay==='cash'?'เงินสด':'โอน'):'',t.due,t.note]);
  });
  return rows.map(function(r){return r.map(function(c){var s=String(c==null?'':c);return /[",\n\t]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',');}).join('\n');
}

  else if(a==='newBill'){U.sheet={kind:'bizdoc',docKind:'bill',id:null};render();}
  else if(a==='newReceipt'){U.sheet={kind:'bizdoc',docKind:'receipt',id:null};render();}
  else if(a==='docView'){U.docKind=el.dataset.kind||'quote';U.docId=id;U.quoteId=id;U.sheet=null;go('quoteprint');}
  else if(a==='editDoc'){U.sheet={kind:'bizdoc',docKind:el.dataset.kind||'bill',id:id};render();}
  else if(a==='convertDoc'){
    var target=el.dataset.kind,sourceKind=U.docKind||'quote',src=(docCollection(sourceKind)||[]).find(function(x){return x.id===id;});if(!src){toast('ไม่พบเอกสารต้นทาง');return;}
    var list=docCollection(target),prefix=target==='bill'?'BL-':'RC-',existing=list.find(function(x){return x.sourceId===src.id&&x.sourceKind===sourceKind;});
    if(existing){U.docKind=target;U.docId=existing.id;go('quoteprint');toast('เปิดเอกสารที่สร้างไว้แล้ว');return;}
    var d={id:uid(),no:nextDocNo(target),date:today(),customer:src.customer,project:src.project,items:docItems(src).map(function(x){return Object.assign({},x);}),description:src.description,qty:src.qty,unit:src.unit,unitPrice:src.unitPrice,discount:+src.discount||0,whtRate:+src.whtRate||0,dueDate:src.dueDate||'',note:src.note||'',sourceId:src.id,sourceKind:sourceKind};
    list.push(d);
    if(target==='receipt'){
      var amt=docCalc(d).total,b=S.business||{};
      var dup=S.tx.find(function(t){return t.docId===d.id;});
      if(!dup)S.tx.push({id:uid(),date:today(),type:'in',amount:Math.round(amt*100)/100,cat:'รับเงินค่างวดงาน',sub:'รับเงินตาม '+d.no,pid:'',partner:d.customer||'',vat:!!b.vatRegistered,wht:false,paid:true,due:'',pay:'transfer',photo:'',note:'สร้างอัตโนมัติจากใบวางบิล '+(src.no||''),docId:d.id});
    }
    persist();U.docKind=target;U.docId=d.id;U.sheet=null;go('quoteprint');toast(target==='bill'?'สร้างใบวางบิลแล้ว':'บันทึกรับเงินและสร้างใบเสร็จแล้ว');
  }
  else if(a==='saveBizDoc'){
    var kind=el.dataset.kind||'bill',list=docCollection(kind),items=[0,1,2].map(function(i){return {description:document.getElementById('ddesc'+i).value.trim(),qty:parseFloat(document.getElementById('dqty'+i).value)||0,unit:document.getElementById('dunit'+i).value.trim()||'งาน',unitPrice:parseFloat(document.getElementById('dprice'+i).value)||0};}).filter(function(x){return x.description;});
    var d={id:id||uid(),no:document.getElementById('dno').value.trim()||nextDocNo(kind),date:document.getElementById('ddate').value||today(),customer:document.getElementById('dcust').value.trim(),project:document.getElementById('dproj').value.trim(),items:items,description:items[0]?items[0].description:'',qty:items[0]?items[0].qty:1,unit:items[0]?items[0].unit:'งาน',unitPrice:items[0]?items[0].unitPrice:0,discount:parseFloat(document.getElementById('ddisc').value)||0,whtRate:parseFloat(document.getElementById('dwht').value)||0,dueDate:document.getElementById('ddue').value||'',note:document.getElementById('dnote').value.trim()};
    if(!d.customer||!items.length){toast('กรอกลูกค้าและอย่างน้อย 1 รายการ');return;}
    var di=list.findIndex(function(x){return x.id===d.id;});if(di>-1)list[di]=d;else list.push(d);persist();U.sheet=null;U.docKind=kind;U.docId=d.id;go('quoteprint');toast('บันทึก'+docTitle(kind)[0]+'แล้ว');
  }
  else if(a==='quoteView'){U.docKind='quote';U.docId=id;U.quoteId=id;U.sheet=null;go('quoteprint');}
  else if(a==='editQuote'){U.sheet={kind:'quote',id:id};render();}
  else if(a==='saveQuote'){
    var q={id:id||uid(),no:document.getElementById('qno').value.trim(),date:document.getElementById('qdate').value||today(),customer:document.getElementById('qcust').value.trim(),project:document.getElementById('qproj').value.trim(),description:document.getElementById('qdesc').value.trim(),qty:parseFloat(document.getElementById('qqty').value)||1,unit:document.getElementById('qunit').value.trim()||'งาน',unitPrice:parseFloat(document.getElementById('qprice').value)||0,note:document.getElementById('qnote').value.trim()};
    if(!q.customer){toast('กรอกชื่อลูกค้าก่อน');return;}
    if(!q.description){toast('กรอกรายละเอียดก่อน');return;}
    var qi=(S.quotes||[]).findIndex(function(x){return x.id===q.id;});if(qi>-1)S.quotes[qi]=q;else S.quotes.push(q);
    persist();U.sheet=null;U.docKind='quote';U.docId=q.id;U.quoteId=q.id;go('quoteprint');toast('บันทึกใบเสนอราคาแล้ว');
  }
  else if(a==='role'){S.role=v;persist();U.view=v==='foreman'?'list':'home';render();}
  else if(a==='saveOpen'){
    S.opening=parseFloat(document.getElementById('op').value)||0;S.openCash=parseFloat(document.getElementById('opc').value)||0;S.bank=document.getElementById('bnk').value.trim();S.brand=document.getElementById('brn').value.trim()||'AREA MAIBAB';
    S.business=S.business||{};S.business.legalName=document.getElementById('blegal').value.trim();S.business.legalNameEn=document.getElementById('blegalen').value.trim();S.business.taxId=document.getElementById('btax').value.trim();S.business.phone=document.getElementById('bphone').value.trim();S.business.email=document.getElementById('bemail').value.trim();S.business.address=document.getElementById('baddr').value.trim();S.business.addressEn=document.getElementById('baddren').value.trim();S.business.branch=document.getElementById('bbranch').value;
    persist();U.sheet=null;render();toast('บันทึกข้อมูลบริษัทแล้ว');
  }
  else if(a==='mprev'){U.month=shiftMonth(U.month,-1);render();}
  else if(a==='mnext'){U.month=shiftMonth(U.month,1);render();}
  else if(a==='csv'){U.sheet={kind:'csv'};render();}
  else if(a==='copyCsv'){
    var box=document.getElementById('csvbox');box.focus();box.select();
    var done=false;try{done=document.execCommand('copy');}catch(x){}
    if(!done&&navigator.clipboard){navigator.clipboard.writeText(box.value).then(function(){toast('คัดลอกแล้ว');},function(){toast('แตะค้างที่ข้อความแล้วเลือกคัดลอก');});}
    else toast(done?'คัดลอกแล้ว':'แตะค้างที่ข้อความแล้วเลือกคัดลอก');
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='rsbox'){U.rsText=e.target.value;return;}
  var f=e.target.dataset&&e.target.dataset.f;if(!f||!U.draft)return;
  U.draft[f]=e.target.value;
  if(f==='amount'){var pv=document.getElementById('prev');if(pv)pv.innerHTML=prevText(U.draft);var af=document.getElementById('amtfmt');if(af){var av=parseFloat(U.draft.amount);af.textContent=av>0?fmt(av,1):'';}}
});
document.addEventListener('change',function(e){if(e.target&&e.target.id==='pdel'){var rd=document.getElementById('prd');if(rd)rd.value=addYearsIso(e.target.value,2);return;}if(e.target&&e.target.dataset&&e.target.dataset.f==='homePid'){U.homePid=e.target.value;try{localStorage.setItem('area-ledger-home-pid',U.homePid);}catch(err){}render();return;}
  var el=e.target,f=el.dataset&&el.dataset.f;
  if(f==='fpid'){U.filter.pid=el.value;render();return;}
  if(f==='fcat'){U.filter.cat=el.value;U.filter.sub='';render();return;}
  if(f==='fsub'){U.filter.sub=el.value;render();return;}
  if(f==='exp'){U.exportPid=el.value;return;}
  if(f&&U.draft){U.draft[f]=el.value;return;}
  if(el.id==='photoIn'&&el.files&&el.files[0]){
    var file=el.files[0],r=new FileReader();
    r.onload=function(){var im=new Image();im.onload=function(){
      var M=720,k=Math.min(1,M/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k);
      var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
      U.draft.photo=c.toDataURL('image/jpeg',.6);render();};im.src=r.result;};
    r.readAsDataURL(file);
  }
});
function saveTx(more){
  var d=U.draft,a=parseFloat(d.amount);
  if(!(a>0)){toast('กรอกจำนวนเงินก่อน');var el=document.getElementById('amt');if(el)el.focus();return;}
  if(!d.pid){toast('เลือกโครงการก่อน');return;}
  var sub=d.type==='out'?(d.sub||'').trim():'';
  var t={id:d.id||uid(),date:d.date||today(),type:d.type,amount:a,cat:d.cat,sub:sub,pay:d.paid?(d.pay||'transfer'):'',pid:d.pid,partner:(d.partner||'').trim(),vat:!!d.vat,wht:!!d.wht,paid:!!d.paid,due:d.paid?'':(d.due||addDays(7)),photo:d.photo||'',note:(d.note||'').trim()};
  var idx=S.tx.findIndex(function(x){return x.id===t.id;});
  if(idx>-1)S.tx[idx]=t;else S.tx.push(t);
  S.last={pid:d.pid,cat:(S.last&&S.last.cat)||CAT_OUT[0],pay:(d.paid?d.pay:(S.last&&S.last.pay))||'transfer'};if(d.type==='out')S.last.cat=d.cat;
  if(!persist())return;
  var was=d.id;U.draft=null;
  if(more&&!was){U.draft=newDraft(d.type,d.pid);U.draft.cat=d.cat;U.draft.date=d.date;render();window.scrollTo(0,0);focusAmt();toast('บันทึกแล้ว เพิ่มรายการต่อได้เลย');return;}
  go(S.role==='foreman'?'list':(U.from==='project'?'project':'list'));
  toast(was?'บันทึกการแก้ไขแล้ว':'บันทึกรายการแล้ว');
}
function boot(){
  try{var hp=localStorage.getItem('area-ledger-home-pid');if(hp)U.homePid=hp;}catch(err){}
  var done=false;
  function start(o){
    if(done)return;done=true;
    var ls=loadLS(),best=ls;
    if(o&&(!ls||(o.updatedAt||0)>(ls.updatedAt||0)))best=o;
    if(best)S=best;
    var recovered=restoreThaSalaKnown();
    var mergedThaSala=mergeThaSalaDocument();
    if(recovered||mergedThaSala)persist();
    if(S.role==='foreman'&&U.view!=='home')U.view='list';
    U.storageBad=!storageOK();
    render();
    if(best&&best===o&&o!==ls)persist();
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  }
  idbGet().then(function(raw){var o=null;try{o=raw?migrate(JSON.parse(raw)):null;}catch(e){}start(o);});
  setTimeout(function(){start(null);},1500);
}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){});}
boot();
</script>
