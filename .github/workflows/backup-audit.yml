name: AREA Ledger Backup Audit (synthetic)
on:
  pull_request:
    paths:
      - 'scripts/backup-audit.cjs'
      - 'tests/backup-audit.cjs'
      - '.github/workflows/backup-audit.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/backup-audit.cjs'
      - 'tests/backup-audit.cjs'
      - '.github/workflows/backup-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-restore-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/backup-audit.cjs
      - run: node --check tests/backup-audit.cjs
      - run: node tests/backup-audit.cjs
