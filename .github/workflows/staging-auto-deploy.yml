name: AREA Ledger Staging Auto Deploy

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: area-ledger-staging-auto
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate staging secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OCR_API_KEY: ${{ secrets.OCR_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$OCR_API_KEY"
      - name: Release QA
        run: |
          node --check gateway/public/sw.js
          node tests/cloudflare-only.cjs
          node tests/qa.cjs
          node tests/gateway-contract.cjs
          node tests/gateway-runtime.cjs
          node tests/cloud-ledger-sync.cjs
          node tests/d1-ledger.cjs
          node tests/r2-files.cjs
          node tests/r2-pwa.cjs
          node tests/cloudflare-production.cjs
          node tests/cloudflare-deploy.cjs
          node tests/v600-stable.cjs
          node tests/v700-business-stable.cjs
          node tests/v800-business-stable.cjs
          node tests/gateway-preflight.cjs
      - name: Deploy staging
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 deploy --env staging
      - name: Configure OCR secret
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OCR_API_KEY: ${{ secrets.OCR_API_KEY }}
        run: printf '%s' "$OCR_API_KEY" | npx --yes wrangler@4.145.0 secret put OCR_API_KEY --env staging
      - name: Apply D1 migrations
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 d1 migrations apply LEDGER_DB --remote --env staging
      - name: Redeploy staging
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 deploy --env staging
      - name: Live acceptance
        env:
          AREA_LEDGER_LIVE_BASE: https://area-ledger-ai-gateway-staging.areamaibab.workers.dev
        run: node tests/live-cloudflare-acceptance.mjs
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-live-acceptance
          path: live-acceptance.json
          if-no-files-found: ignore
