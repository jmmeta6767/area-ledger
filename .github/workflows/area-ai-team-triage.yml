name: AREA AI Team - Issue Intake

on:
  pull_request:
    paths:
      - 'tools/area-ai-team/**'
      - 'tests/area-ai-team-triage.cjs'
      - '.github/workflows/area-ai-team-triage.yml'
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Existing issue number to plan (does not start Codex or deploy)'
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: area-ai-team-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate issue intake without side effects
        run: node tests/area-ai-team-triage.cjs

  dry-run-sprint-138:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate intake contract
        run: node tests/area-ai-team-triage.cjs
      - name: Run read-only triage against actual Sprint Issue 138
        uses: actions/github-script@v7
        with:
          script: |
            const {planIssue,renderComment}=require('./tools/area-ai-team/triage.cjs');
            const {owner,repo}=context.repo;
            const response=await github.rest.issues.get({owner,repo,issue_number:138});
            const plan=planIssue(response.data);
            const summary=renderComment(plan);
            core.summary.addHeading('AREA AI Team - real Issue #138 dry-run');
            core.summary.addRaw(summary+'\n\nNo Issue was changed; Codex was not invoked; no merge or deploy occurred.');
            await core.summary.write();
            if(!plan.implementers.includes('AI-03')||!plan.implementers.includes('AI-04')){
              core.setFailed('Expected OCR + accounting specialists for Issue #138');
            }

  plan-issue:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'area-ai-task')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate triage code on deterministic tests
        run: node tests/area-ai-team-triage.cjs
      - name: Publish or update planning-only issue comment
        uses: actions/github-script@v7
        env:
          TRIAGE_ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {planIssue,renderComment,findOwnComment}=require('./tools/area-ai-team/triage.cjs');
            const issue_number=Number(process.env.TRIAGE_ISSUE_NUMBER);
            if(!Number.isSafeInteger(issue_number)||issue_number<1)throw Error('Invalid issue number');
            const {owner,repo}=context.repo;
            const response=await github.rest.issues.get({owner,repo,issue_number});
            if(response.data.pull_request)throw Error('Target must be an issue, not a pull request');
            const plan=planIssue(response.data);
            const body=renderComment(plan);
            const comments=await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number,per_page:100});
            const previous=findOwnComment(comments);
            if(previous){
              await github.rest.issues.updateComment({owner,repo,comment_id:previous.id,body});
              core.info('Updated AI Team planning-only issue comment');
            } else {
              await github.rest.issues.createComment({owner,repo,issue_number,body});
              core.info('Created AI Team planning-only issue comment');
            }
            core.info('No Codex execution, financial write, branch merge or deployment was triggered.');
