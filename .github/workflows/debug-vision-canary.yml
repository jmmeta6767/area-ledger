name: Debug Production Vision Canary

on:
  push:
    branches:
      - debug/vision-canary-20261003

permissions:
  contents: read

jobs:
  direct-gemini:
    runs-on: ubuntu-latest
    environment: production
    env:
      GEMINI_API_KEY: ${{ secrets.OCR_API_KEY }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe current Gemini models without exposing key
        shell: bash
        run: |
          cat > /tmp/gemini.mjs <<'NODE'
          const key=process.env.GEMINI_API_KEY;
          if(!key) throw new Error('missing key');
          const pixel='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=';
          const tests=[
            {name:'3.5-text',model:'gemini-3.5-flash',body:{contents:[{parts:[{text:'Reply only OK'}]}]}},
            {name:'3.8-text',model:'gemini-3.8-flash',body:{contents:[{parts:[{text:'Reply only OK'}]}]}},
            {name:'3.5-image',model:'gemini-3.5-flash',body:{contents:[{parts:[{text:'Describe this image briefly'},{inline_data:{mime_type:'image/png',data:pixel}}]}]}},
            {name:'3.8-image',model:'gemini-3.8-flash',body:{contents:[{parts:[{text:'Describe this image briefly'},{inline_data:{mime_type:'image/png',data:pixel}}]}]}}
          ];
          for(const t of tests){
            const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(t.model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(t.body)});
            const body=await r.text();
            console.log('CASE '+t.name+' STATUS '+r.status);
            console.log(body.slice(0,1600));
          }
          NODE
          node /tmp/gemini.mjs
