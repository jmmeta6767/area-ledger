name: Debug Production Vision Canary

on:
  push:
    branches:
      - debug/vision-canary-20261003

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Call production Gateway with known-valid PNG
        shell: bash
        run: |
          cat > /tmp/gateway.mjs <<'NODE'
          import crypto from 'node:crypto';
          const rid='debug-gateway-'+crypto.randomBytes(8).toString('hex');
          const started=Date.now();
          const r=await fetch('https://area-ledger-ai-gateway.areamaibab.workers.dev/v1/ocr/expense',{
            method:'POST',
            headers:{
              Origin:'https://g.areamaibab.workers.dev',
              'Content-Type':'application/json',
              'X-AREA-Gateway-Version':'1',
              'X-AREA-Request-ID':rid
            },
            body:JSON.stringify({image:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=',lang:'tha+eng'})
          });
          const body=await r.text();
          console.log(JSON.stringify({status:r.status,ok:r.ok,durationMs:Date.now()-started,protocol:r.headers.get('x-area-gateway-version'),requestId:r.headers.get('x-area-request-id'),allowOrigin:r.headers.get('access-control-allow-origin'),body},null,2));
          NODE
          node /tmp/gateway.mjs
