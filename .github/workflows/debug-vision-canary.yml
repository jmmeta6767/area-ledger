name: Debug Production Vision Canary

on:
  push:
    branches:
      - debug/vision-canary-20261003

permissions:
  contents: read

jobs:
  direct-gemini:
    runs-on: ubuntu-latest
    environment: production
    env:
      GEMINI_API_KEY: ${{ secrets.OCR_API_KEY }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare Gemini request variants without exposing key
        shell: bash
        run: |
          cat > /tmp/gemini.mjs <<'NODE'
          const key=process.env.GEMINI_API_KEY;
          if(!key) throw new Error('missing key');
          const image='';
          const tests=[
            {name:'2.5-text',model:'gemini-2.5-flash',body:{contents:[{parts:[{text:'Reply with the word OK'}]}]}},
            {name:'2.5-image-json',model:'gemini-2.5-flash',body:{contents:[{role:'user',parts:[{text:'Read TOTAL from this receipt. Return JSON only: {"amount":number}'},{inline_data:{mime_type:'image/png',data:image}}]}],generationConfig:{responseMimeType:'application/json',temperature:0}}},
            {name:'3.5-image-json',model:'gemini-3.5-flash',body:{contents:[{role:'user',parts:[{text:'Read TOTAL from this receipt. Return JSON only: {"amount":number}'},{inline_data:{mime_type:'image/png',data:image}}]}],generationConfig:{responseMimeType:'application/json',temperature:0}}}
          ];
          for(const t of tests){
            const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(t.model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(t.body)});
            const body=await r.text();
            console.log('CASE '+t.name+' STATUS '+r.status);
            console.log(body.slice(0,3000));
          }
          NODE
          node /tmp/gemini.mjs
