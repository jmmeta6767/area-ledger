name: AREA Ledger Production Cutover v805

on:
  workflow_run:
    workflows: ["AREA Ledger Staging Auto Deploy"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: area-ledger-production-cutover
  cancel-in-progress: false

jobs:
  authorize:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      source_sha: ${{ steps.gate.outputs.source_sha }}
      staging_run_id: ${{ steps.gate.outputs.staging_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: gate
        name: Verify one-time production authorization
        shell: bash
        run: |
          AUTHORIZED=false
          if [ -f .github/production-cutover-v805 ] && [ "$(tr -d '\r\n' < .github/production-cutover-v805)" = "DEPLOY_PRODUCTION" ]; then
            AUTHORIZED=true
          fi
          SOURCE_SHA="${{ github.event.workflow_run.head_sha }}"
          STAGING_RUN_ID="${{ github.event.workflow_run.id }}"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "authorized=$AUTHORIZED" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "staging_run_id=$STAGING_RUN_ID" >> "$GITHUB_OUTPUT"
          if [ "$AUTHORIZED" = "true" ]; then
            echo "Production cutover authorized for staging-tested SHA $SOURCE_SHA"
          else
            echo "Production cutover authorization marker absent; production deploy will stay skipped."
          fi

  deploy-production:
    needs: authorize
    if: ${{ needs.authorize.outputs.authorized == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Re-verify exact tested source and authorization
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.authorize.outputs.source_sha }}"
          test -f .github/production-cutover-v805
          test "$(tr -d '\r\n' < .github/production-cutover-v805)" = "DEPLOY_PRODUCTION"

      - name: Production secret preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OCR_API_KEY: ${{ secrets.OCR_API_KEY }}
        shell: bash
        run: |
          TOKEN_OK=false
          ACCOUNT_OK=false
          OCR_OK=false
          [ -n "$CLOUDFLARE_API_TOKEN" ] && TOKEN_OK=true
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && ACCOUNT_OK=true
          [ -n "$OCR_API_KEY" ] && OCR_OK=true
          OK=false
          if [ "$TOKEN_OK" = true ] && [ "$ACCOUNT_OK" = true ] && [ "$OCR_OK" = true ]; then OK=true; fi
          cat > production-preflight.json <<EOF
          {
            "sourceSha": "${{ needs.authorize.outputs.source_sha }}",
            "workflowRun": "${{ github.run_id }}",
            "stagingRun": "${{ needs.authorize.outputs.staging_run_id }}",
            "checks": {
              "cloudflareApiToken": $TOKEN_OK,
              "cloudflareAccountId": $ACCOUNT_OK,
              "ocrApiKey": $OCR_OK
            },
            "ok": $OK
          }
          EOF
          [ "$TOKEN_OK" = true ] || echo "::error::Missing production Environment secret: CLOUDFLARE_API_TOKEN"
          [ "$ACCOUNT_OK" = true ] || echo "::error::Missing production Environment secret: CLOUDFLARE_ACCOUNT_ID"
          [ "$OCR_OK" = true ] || echo "::error::Missing production Environment secret: OCR_API_KEY"
          test "$OK" = true

      - name: Full release QA
        run: |
          node --check gateway/public/sw.js
          node --check sw.js
          node tests/cloudflare-only.cjs
          node tests/qa.cjs
          node tests/gateway-contract.cjs
          node tests/gateway-runtime.cjs
          node tests/cloud-ledger-sync.cjs
          node tests/d1-ledger.cjs
          node tests/r2-files.cjs
          node tests/r2-pwa.cjs
          node tests/cloudflare-production.cjs
          node tests/cloudflare-deploy.cjs
          node tests/v600-stable.cjs
          node tests/v700-business-stable.cjs
          node tests/v800-business-stable.cjs
          node tests/production-cutover-v805.cjs
          node --check tests/live-cloudflare-acceptance.mjs
          node --check tests/capture-production-bindings.mjs
          node tests/gateway-preflight.cjs

      - name: Deploy production and auto-provision isolated bindings
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 deploy

      - name: Capture auto-provisioned production bindings
        env:
          AREA_LEDGER_ACCEPTANCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          AREA_LEDGER_ACCEPTANCE_RUN: ${{ github.run_id }}
          AREA_LEDGER_STAGING_RUN: ${{ needs.authorize.outputs.staging_run_id }}
        run: node tests/capture-production-bindings.mjs

      - name: Configure production OCR secret
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OCR_API_KEY: ${{ secrets.OCR_API_KEY }}
        run: printf '%s' "$OCR_API_KEY" | npx --yes wrangler@4.145.0 secret put OCR_API_KEY

      - name: Configure production Google Workspace secrets when provided
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_TOKEN_KEY: ${{ secrets.GOOGLE_TOKEN_KEY }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID$GOOGLE_CLIENT_SECRET$GOOGLE_TOKEN_KEY" ]; then
            echo "Google Workspace secrets not configured; integration remains disabled."
            exit 0
          fi
          test -n "$GOOGLE_CLIENT_ID" && test -n "$GOOGLE_CLIENT_SECRET" && test -n "$GOOGLE_TOKEN_KEY"
          printf '%s' "$GOOGLE_CLIENT_ID" | npx --yes wrangler@4.145.0 secret put GOOGLE_CLIENT_ID
          printf '%s' "$GOOGLE_CLIENT_SECRET" | npx --yes wrangler@4.145.0 secret put GOOGLE_CLIENT_SECRET
          printf '%s' "$GOOGLE_TOKEN_KEY" | npx --yes wrangler@4.145.0 secret put GOOGLE_TOKEN_KEY

      - name: Apply production D1 migrations
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 d1 migrations apply LEDGER_DB --remote

      - name: Redeploy production after migrations
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 deploy

      - name: Live production acceptance
        env:
          AREA_LEDGER_LIVE_BASE: https://area-ledger-ai-gateway.areamaibab.workers.dev
          AREA_LEDGER_ACCEPTANCE_TARGET: production
          AREA_LEDGER_ACCEPTANCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          AREA_LEDGER_ACCEPTANCE_RUN: ${{ github.run_id }}
        run: node tests/live-cloudflare-acceptance.mjs

      - name: Upload production cutover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-cutover-v805
          path: |
            live-acceptance.json
            production-bindings.json
            production-preflight.json
          if-no-files-found: ignore
