name: AREA Ledger Cloudflare Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Cloudflare environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  contents: read

concurrency:
  group: area-ledger-cloudflare-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Full release QA
        run: |
          node --check gateway/public/sw.js
          node --check sw.js
          node tests/cloudflare-only.cjs
          node tests/qa.cjs
          node tests/gateway-contract.cjs
          node tests/gateway-runtime.cjs
          node tests/cloud-ledger-sync.cjs
          node tests/d1-ledger.cjs
          node tests/r2-files.cjs
          node tests/r2-pwa.cjs
          node tests/cloudflare-production.cjs
          node tests/cloudflare-deploy.cjs
          node tests/gateway-preflight.cjs

      - name: Deploy staging and auto-provision bindings
        if: ${{ inputs.target == 'staging' }}
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --env staging

      - name: Apply staging D1 migrations
        if: ${{ inputs.target == 'staging' }}
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest d1 migrations apply LEDGER_DB --remote --env staging

      - name: Redeploy staging after migrations
        if: ${{ inputs.target == 'staging' }}
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --env staging

      - name: Deploy production and auto-provision bindings
        if: ${{ inputs.target == 'production' }}
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Apply production D1 migrations
        if: ${{ inputs.target == 'production' }}
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest d1 migrations apply LEDGER_DB --remote

      - name: Redeploy production after migrations
        if: ${{ inputs.target == 'production' }}
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
