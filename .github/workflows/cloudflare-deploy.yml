name: AREA Ledger Cloudflare Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Cloudflare environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      confirm_production:
        description: Type DEPLOY_PRODUCTION only when intentionally deploying production
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: area-ledger-cloudflare-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Production confirmation gate
        if: ${{ inputs.target == 'production' }}
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: test "$CONFIRM_PRODUCTION" = "DEPLOY_PRODUCTION"

      - name: Validate Cloudflare deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OCR_API_KEY: ${{ secrets.OCR_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$OCR_API_KEY"

      - name: Full release QA
        run: |
          node --check gateway/public/sw.js
          node --check sw.js
          node tests/cloudflare-only.cjs
          node tests/qa.cjs
          node tests/reliability-v1048.cjs
          node tests/gateway-contract.cjs
          node tests/gateway-runtime.cjs
          node tests/cloud-ledger-sync.cjs
          node tests/d1-ledger.cjs
          node tests/r2-files.cjs
          node tests/r2-pwa.cjs
          node tests/cloudflare-production.cjs
          node tests/cloudflare-deploy.cjs
          node tests/v600-stable.cjs
          node tests/v700-business-stable.cjs
          node tests/v800-business-stable.cjs
          node tests/v900-business-stable.cjs
          node tests/v1000-business-stable.cjs
          node tests/production-cutover-v805.cjs
          node --check tests/live-cloudflare-acceptance.mjs
          node --check tests/capture-production-bindings.mjs
          node tests/gateway-preflight.cjs
          node tests/legacy-app.cjs

      - name: Stamp deployment identity
        run: node tests/stamp-build.mjs ${{ github.sha }} ${{ inputs.target }}

      - name: Deploy staging and auto-provision bindings
        if: ${{ inputs.target == 'staging' }}
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 deploy --env staging

      - name: Configure staging OCR secret
        if: ${{ inputs.target == 'staging' }}
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OCR_API_KEY: ${{ secrets.OCR_API_KEY }}
        run: printf '%s' "$OCR_API_KEY" | npx --yes wrangler@4.145.0 secret put OCR_API_KEY --env staging

      - name: Apply staging D1 migrations
        if: ${{ inputs.target == 'staging' }}
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 d1 migrations apply LEDGER_DB --remote --env staging

      - name: Redeploy staging after migrations
        if: ${{ inputs.target == 'staging' }}
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 deploy --env staging

      - name: Live staging acceptance
        if: ${{ inputs.target == 'staging' }}
        env:
          AREA_LEDGER_LIVE_BASE: https://area-ledger-ai-gateway-staging.areamaibab.workers.dev
          AREA_LEDGER_ACCEPTANCE_TARGET: staging
          AREA_LEDGER_ACCEPTANCE_SHA: ${{ github.sha }}
          AREA_LEDGER_ACCEPTANCE_RUN: ${{ github.run_id }}
        run: node tests/live-cloudflare-acceptance.mjs

      - name: Deploy production and auto-provision bindings
        if: ${{ inputs.target == 'production' }}
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 deploy

      - name: Configure production OCR secret
        if: ${{ inputs.target == 'production' }}
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OCR_API_KEY: ${{ secrets.OCR_API_KEY }}
        run: printf '%s' "$OCR_API_KEY" | npx --yes wrangler@4.145.0 secret put OCR_API_KEY

      - name: Apply production D1 migrations
        if: ${{ inputs.target == 'production' }}
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 d1 migrations apply LEDGER_DB --remote

      - name: Redeploy production after migrations
        if: ${{ inputs.target == 'production' }}
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 deploy

      - name: Deploy legacy g production app shell
        if: ${{ inputs.target == 'production' }}
        working-directory: legacy-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 deploy

      - name: Live production acceptance
        if: ${{ inputs.target == 'production' }}
        env:
          AREA_LEDGER_LIVE_BASE: https://area-ledger-ai-gateway.areamaibab.workers.dev
          AREA_LEDGER_APP_BASE: https://g.areamaibab.workers.dev
          AREA_LEDGER_ACCEPTANCE_TARGET: production
          AREA_LEDGER_ACCEPTANCE_SHA: ${{ github.sha }}
          AREA_LEDGER_ACCEPTANCE_RUN: ${{ github.run_id }}
        run: node tests/live-cloudflare-acceptance.mjs

      - name: Upload production acceptance evidence
        if: ${{ always() && inputs.target == 'production' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-live-acceptance
          path: live-acceptance.json
          if-no-files-found: ignore
