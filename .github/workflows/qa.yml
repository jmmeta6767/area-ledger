name: AREA Ledger Release QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: area-ledger-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Main service worker syntax
        run: node --check sw.js
      - name: Regression QA
        run: node tests/qa.cjs
      - name: Gateway contract QA
        run: node tests/gateway-contract.cjs
      - name: Gateway runtime QA
        run: node tests/gateway-runtime.cjs
      - name: Gateway staging preflight
        run: node tests/gateway-preflight.cjs
