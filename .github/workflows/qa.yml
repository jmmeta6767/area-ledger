name: AREA Ledger Release QA

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: area-ledger-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iphone-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/layout-runtime" playwright@1.62.1
          "$RUNNER_TEMP/layout-runtime/node_modules/.bin/playwright" install --with-deps chromium
      - name: iPhone layout and scroll regression
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/layout-runtime/node_modules/playwright
          LAYOUT_OUTPUT: layout-evidence
        run: |
          node tests/iphone-layout.cjs
          node tests/iphone-card-keyboard.cjs
          node tests/iphone-project-keyboard.cjs
          node tests/iphone-project-create-keyboard.cjs
          node tests/project-mobile-budget.cjs
      - name: Upload before and after layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-layout-evidence
          path: layout-evidence
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build identity script syntax
        run: node --check tests/stamp-build.mjs
      - name: Live acceptance script syntax
        run: node --check tests/live-cloudflare-acceptance.mjs
      - name: Cloudflare service worker syntax
        run: node --check gateway/public/sw.js
      - name: Legacy recovery service worker syntax
        run: node --check sw.js
      - name: Cloudflare-only deployment contract
        run: node tests/cloudflare-only.cjs
      - name: Native store package contract
        run: node tests/mobile-store-contract.cjs
      - name: Regression QA
        run: node tests/qa.cjs
      - name: BOQ provenance regression
        run: node tests/boq-quality-provenance.cjs
      - name: Real document quality verifier regression
        run: node tests/boq-quality-contract.mjs
      - name: Gateway contract QA
        run: node tests/gateway-contract.cjs
      - name: Gateway runtime QA
        run: node tests/gateway-runtime.cjs
      - name: Cloudflare ledger sync QA
        run: node tests/cloud-ledger-sync.cjs
      - name: D1 ledger shadow QA
        run: node tests/d1-ledger.cjs
      - name: R2 attachment vault QA
        run: node tests/r2-files.cjs
      - name: R2 PWA attachment cutover QA
        run: node tests/r2-pwa.cjs
      - name: Public client portfolio privacy QA
        run: node tests/public-profile.cjs
      - name: v1030 UX/UI regression
        run: node tests/ux-ui-v1030.cjs
      - name: v1031 iPhone UX regression
        run: node tests/ux-ui-v1031.cjs
      - name: v1032 mobile command UX regression
        run: node tests/ux-ui-v1032.cjs
      - name: v1033 documents settings accessibility regression
        run: node tests/ux-ui-v1033.cjs
      - name: v1034 CSS QA polish regression
        run: node tests/ux-ui-v1034.cjs
      - name: v1035 runtime performance regression
        run: node tests/runtime-v1035.cjs
      - name: v1036 runtime memory stability regression
        run: node tests/runtime-v1036.cjs
      - name: v1037 Safari long-session stability regression
        run: node tests/runtime-v1037.cjs
      - name: v1039 full-app UX/UI audit regression
        run: node tests/ux-ui-v1039.cjs
      - name: Cloudflare production contract QA
        run: node tests/cloudflare-production.cjs
      - name: Cloudflare deploy pipeline QA
        run: node tests/cloudflare-deploy.cjs
      - name: v600 stable source baseline QA
        run: node tests/v600-stable.cjs
      - name: v700 business stable baseline QA
        run: node tests/v700-business-stable.cjs
      - name: v800 business stable 1.0 QA
        run: node tests/v800-business-stable.cjs
      - name: v900 business stable candidate QA
        run: node tests/v900-business-stable.cjs
      - name: v1000 business stable candidate QA
        run: node tests/v1000-business-stable.cjs
      - name: v805 production cutover contract QA
        run: node tests/production-cutover-v805.cjs
      - name: Live acceptance script syntax
        run: node --check tests/live-cloudflare-acceptance.mjs
      - name: Production binding capture syntax
        run: node --check tests/capture-production-bindings.mjs
      - name: Gateway staging preflight
        run: |
          node tests/gateway-preflight.cjs
          node tests/legacy-app.cjs
