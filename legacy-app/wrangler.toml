name = "g"
main = "src/worker.js"
compatibility_date = "2026-09-30"

[build]
command = "node ../tests/assert-deploy-identity.cjs"

[assets]
directory = "../gateway/public"
binding = "ASSETS"
# Keep .html entry paths canonical: Cloudflare default redirects them (307).
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = ["/", "/index.html", "/sw.js", "/legacy-health", "/health", "/ready", "/v1/*"]


[[services]]
binding = "GATEWAY"
service = "area-ledger-ai-gateway"
