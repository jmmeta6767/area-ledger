/* URGENT SMART ALERT ‚Äî only immediate and near-term issues */
.urgent-alert{

.urgent-copy{min-width:0}.urgent-copy b,.urgent-copy small{display:block}.urgent-copy b{font-size:11.5px;line-height:1.25}.urgent-copy small{font-size:8.7px;line-height:1.3;margin-top:2px;color:#69757e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.urgent-alert>strong{font-size:20px;color:#8f99a2}

@keyframes urgentPop{from{opacity:.3;transform:translateY(-5px)}to{opacity:1;transform:none}}

body.sheet-open .app-topbar-menu,body[data-view="print"] .app-social-topbar,body[data-view="quoteprint"] .app-social-topbar{display:none!important}
/* On the company profile, float the controls over the cover photo like Facebook's profile header. */
body.view-profile .app-social-topbar{position:absolute;top:8px;left:0;right:0;min-height:64px;padding:0 18px;background:transparent;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;grid-template-columns:44px minmax(0,1fr) auto;pointer-events:none}
body.view-profile .app-topbar-menu,body.view-profile .app-topbar-actions{pointer-events:auto}
body.view-profile .app-topbar-menu{background:rgba(17,24,39,.38);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
body.view-profile .app-topbar-menu span{background:#fff}
body.view-profile .app-topbar-brand{visibility:hidden}
body.view-profile .app-topbar-actions{gap:7px}
body.view-profile .app-topbar-actions .app-topbar-action{width:42px;height:42px;border:1px solid rgba(255,255,255,.28);background:rgba(17,24,39,.34);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
body.view-profile .app-topbar-actions .app-topbar-action:active{background:rgba(17,24,39,.62)}
body.view-profile main{padding-top:8px!important}
body.view-add main{padding-top:0!important}
@media(max-width:360px){.app-social-topbar{grid-template-columns:40px minmax(70px,1fr) auto;gap:5px;padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}.app-topbar-menu{width:40px;height:44px}.app-topbar-actions{gap:2px}.app-topbar-action{width:38px;height:42px}.app-topbar-brand{font-size:1.1rem}}

body.view-add #app,body.view-add main{background:var(--color-background)!important;color:var(--color-text)!important}
body.view-add main{padding-top:12px!important}
