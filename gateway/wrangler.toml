name = "area-ledger-ai-gateway"
main = "src/worker.js"
compatibility_date = "2026-09-30"
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/health", "/ready", "/v1/*"]

[vars]
RATE_LIMIT_PER_MINUTE = "20"
LEDGER_RATE_LIMIT_PER_MINUTE = "60"
OCR_PROVIDER = "generic"
PROVIDER_TIMEOUT_MS = "10000"
PROVIDER_RETRIES = "1"
REQUIRE_DURABLE_STATE = "true"
# Set ALLOWED_ORIGINS at deploy time to exact production/preview origins.
# Set OCR_UPSTREAM_URL as a non-secret environment variable.
# Store OCR_API_KEY with the platform secret store; never commit it.

# Optional bindings for production durability/privacy-safe audit:
# GATEWAY_STATE = Durable Object namespace implementing rate/idem operations.
# GATEWAY_AUDIT = R2 bucket storing metadata only (requestId/origin/status/provider/duration/at).
# Never store OCR image payloads, extracted text, amounts, partner names or accounting data in gateway audit.

[[durable_objects.bindings]]
name = "GATEWAY_STATE"
class_name = "GatewayState"

[exports.GatewayState]
type = "durable-object"
storage = "sqlite"

# Staging preflight: configure exact ALLOWED_ORIGINS and provider secrets before deploy.
# R2 audit binding remains optional and should be enabled only with a retention policy.

[env.staging]
name = "area-ledger-ai-gateway-staging"

[env.staging.vars]
RATE_LIMIT_PER_MINUTE = "10"
LEDGER_RATE_LIMIT_PER_MINUTE = "60"
OCR_PROVIDER = "gemini"
GEMINI_MODEL = "gemini-2.5-flash"
PROVIDER_TIMEOUT_MS = "10000"
PROVIDER_RETRIES = "0"
REQUIRE_DURABLE_STATE = "true"

[[env.staging.durable_objects.bindings]]
name = "GATEWAY_STATE"
class_name = "GatewayState"

[env.staging.exports.GatewayState]
type = "durable-object"
storage = "sqlite"
