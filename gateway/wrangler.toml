name = "area-ledger-ai-gateway"
main = "src/worker.js"
compatibility_date = "2026-09-30"
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/health", "/ready", "/v1/*"]

[vars]
RATE_LIMIT_PER_MINUTE = "20"
LEDGER_RATE_LIMIT_PER_MINUTE = "60"
OCR_PROVIDER = "gemini"
GEMINI_MODEL = "gemini-3.5-flash-lite"
PROVIDER_TIMEOUT_MS = "40000"
PROVIDER_RETRIES = "1"
REQUIRE_DURABLE_STATE = "true"
ALLOWED_ORIGINS = "https://area-ledger-ai-gateway.areamaibab.workers.dev,https://g.areamaibab.workers.dev,capacitor://localhost,https://localhost"
# Set OCR_UPSTREAM_URL as a non-secret environment variable.
# Store OCR_API_KEY with the platform secret store; never commit it.

# Optional bindings for production durability/privacy-safe audit:
# GATEWAY_STATE = Durable Object namespace implementing rate/idem operations.
# GATEWAY_AUDIT = R2 bucket storing metadata only (requestId/origin/status/provider/duration/at).
# Never store OCR image payloads, extracted text, amounts, partner names or accounting data in gateway audit.

[[durable_objects.bindings]]
name = "GATEWAY_STATE"
class_name = "GatewayState"

[exports.GatewayState]
type = "durable-object"
storage = "sqlite"

# Production resources provisioned by the first intentional cutover and now pinned for deterministic redeploys.
[[d1_databases]]
binding = "LEDGER_DB"
database_name = "area-ledger-ai-gateway-ledger-db"
database_id = "72fc4f7e-63ec-42ca-8a2e-7b1dc61bf72d"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "LEDGER_FILES"
bucket_name = "area-ledger-ai-gateway-ledger-files"

# Staging preflight: configure exact ALLOWED_ORIGINS and provider secrets before deploy.
# R2 audit binding remains optional and should be enabled only with a retention policy.

[env.staging]
name = "area-ledger-ai-gateway-staging"

[env.staging.vars]
RATE_LIMIT_PER_MINUTE = "10"
LEDGER_RATE_LIMIT_PER_MINUTE = "60"
OCR_PROVIDER = "gemini"
GEMINI_MODEL = "gemini-3.5-flash-lite"
PROVIDER_TIMEOUT_MS = "40000"
PROVIDER_RETRIES = "0"
REQUIRE_DURABLE_STATE = "true"
ALLOWED_ORIGINS = "https://area-ledger-ai-gateway-staging.areamaibab.workers.dev,capacitor://localhost,https://localhost"

[[env.staging.durable_objects.bindings]]
name = "GATEWAY_STATE"
class_name = "GatewayState"

[env.staging.exports.GatewayState]
type = "durable-object"
storage = "sqlite"

[[env.staging.d1_databases]]
binding = "LEDGER_DB"
database_name = "area-ledger-ai-gateway-staging-ledger-db"
database_id = "9fed2450-55f1-4ec3-ba5f-1e12293bb10a"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "LEDGER_FILES"
bucket_name = "area-ledger-ai-gateway-staging-ledger-files"
